name: iot-agent-backend-local

services:
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--skip-log-bin"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: iot_agent
      MYSQL_USER: iot_agent
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./var/docker/mysql:/var/lib/mysql
      - ./src/main/resources/db/mysql/agent-facts.sql:/docker-entrypoint-initdb.d/001-agent-facts.sql:ro
    secrets:
      - mysql_password
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/mysql_password)\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./var/docker/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  mysql_password:
    file: ./var/config/infrastructure/local/mysql-password
  mysql_root_password:
    file: ./var/config/infrastructure/local/mysql-root-password
