server:
  address: 127.0.0.1
  port: 3381

spring:
  application:
    name: iot-agent-backend
  # Customer history pages are large: a 500-row energy page is ~650KB, well past the
  # 256KB codec default, which surfaced as "上游请求失败" instead of data.
  codec:
    max-in-memory-size: 8MB

agent:
  bridge:
    # Token arrives from the shared secret file via the external native config's
    # configtree import (file agent.bridge.token in the dedicated shared dir).
    base-url: ''
    token: ''
    run-timeout-ms: 120000
  report:
    # Stamp written into generated reports; deployments override from external config.
    build-id: local
  heartbeat-ms: 15000
  video:
    # Exact browser origin of the video player page; empty keeps cross-origin
    # playback closed. Never a wildcard, cookie or general Agent API CORS policy.
    allowed-origin: ''
  storage:
    # Explicit external decision: durable stores stay disabled unless the
    # deployment's native config enables them with real connection settings.
    mysql:
      enabled: false
    redis:
      enabled: false
  control:
    mode: ''
    fixture:
      outcome: accepted
      readback: confirmed
      task-outcome: COMPLETED
iot:
  gateway:
    base-url: ''
    office-scope-path: ''
    company-scope-path: ''
    office-membership-path: /micro-api/api/office/office/member/my/office
    office-ac-path: /micro-api/api/office/app/device/ac/myOffice/pageByAc
    office-lighting-path: /micro-api/api/office/device/page
    office-access-path: /micro-api/api/office/device/page
    office-video-path: /micro-api/api/office/device/page
    office-ac-association-path: /micro-api/api/office/acAreaDevice/page
    office-lighting-association-path: /micro-api/api/office/lightingAreaDevice/page
    office-access-association-path: /micro-api/api/office/accessAreaDevice/page
    call-timeout-ms: 30000
    company-energy-path: /micro-api/api/energy/equipment/page
    company-safety-path: /micro-api/api/perception/device/page
    company-safety-detail-path: /micro-api/api/iot-center/device
    company-smart-base-path: /micro-api/api/office/app/device
    company-ac-area-path: /micro-api/api/office/app/device/ac/myAreaList
    company-ac-device-path: /micro-api/api/office/app/device/ac/devicePage
    company-ac-binding-path: /micro-api/api/iot-center/device/page
  observation:
    routes:
      environment-history: /micro-api/api/iot-center/env/history/page
      energy-history: /micro-api/api/energy/electricData/page
      dashboard: ''
      safety-events: ''
      safety-event: ''
      safety-event-cameras: ''
      energy-comparison: ''
      energy-report: ''
      company-energy-daily: ''
      company-energy-report: ''
      company-meter-report: ''
      video-stream: ''
      report: ''
      report-download: ''
    # HMAC key for safety-ledger continuation cursors (hex 64 or >=16-byte text);
    # falls back to the shared admin.config-secret-key. Empty = per-boot ephemeral
    # key, so a restart invalidates outstanding cursors with an honest re-query error.
    safety-cursor-secret: ${admin.config-secret-key:}
  identity:
    verify: true
    verify-timeout-ms: 10000
    # Verified identities refresh in the background. Outages never extend the last successful check.
    refresh-interval-ms: 60000
    max-validation-age-ms: 86400000
    retry-cooldown-ms: 60000
