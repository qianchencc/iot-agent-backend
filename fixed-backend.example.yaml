# Nonsecret template for the fixed local backend (Java 3381 / Node 3382 / console 5185).
#
# Copy to var/fixed-backend/launch.yaml (git-ignored), chmod 600, replace the
# illustrative absolute paths, and fill every empty secret. tools/start-fixed-backend.py
# validates the file and execs exactly one environment per component; it never loads
# .env and never inherits the ambient shell environment. Required secrets stay empty
# here on purpose: the backend fails closed instead of starting with weak defaults,
# and no real credential ever belongs in this file or in Git.
#
# Model and observability settings are NOT environment inputs. They are owned by the
# Java admin configuration store (MySQL revisions); do not add MODEL_*, LANGFUSE_*
# or AGENT_THINKING_LEVEL bootstrap values to any entry.

java:
  executable: /opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home/bin/java
  artifact: /Users/yourname/dev/iot-agent-backend/var/fixed-latest-YYYYMMDD-HHMMSS/iot-agent-backend.jar
  working_directory: /Users/yourname/dev/iot-agent-backend
  environment:
    # Fixed frontend-facing port; Node 3382 stays private behind Java.
    SERVER_PORT: '3381'
    # Customer gateway for real identity, observations and confirmed device control.
    # Empty fails identity and scope reads closed instead of skipping verification.
    IOT_GATEWAY_BASE_URL: ''
    IOT_GATEWAY_CALL_TIMEOUT_MS: '15000'
    IOT_GATEWAY_OFFICE_SCOPE_PATH: '/micro-api/api/office/device/page'
    IOT_GATEWAY_COMPANY_SCOPE_PATH: '/micro-api/api/iot-center/device/page'
    IOT_IDENTITY_VERIFY: 'true'
    IOT_IDENTITY_VERIFY_TIMEOUT_MS: '15000'
    IOT_IDENTITY_REFRESH_INTERVAL_MS: '60000'
    IOT_IDENTITY_MAX_VALIDATION_AGE_MS: '86400000'
    IOT_IDENTITY_RETRY_COOLDOWN_MS: '60000'
    # Java -> Node private bridge. Random local-only token; the node entry below must
    # receive the same value for AGENT_BRIDGE_TOKEN and JAVA_AGENT_TOOLS_TOKEN.
    AGENT_BRIDGE_BASE_URL: 'http://127.0.0.1:3382'
    AGENT_BRIDGE_TOKEN: ''
    AGENT_BRIDGE_RUN_TIMEOUT_MS: '120000'
    AGENT_HEARTBEAT_MS: '15000'
    # Exact browser origin of the separately served video player page; empty keeps
    # cross-origin video playback closed. Never a wildcard.
    AGENT_VIDEO_ALLOWED_ORIGIN: ''
    # Durable business facts and Pi Sessions live in MySQL; Redis is coordination only.
    # AGENT_MYSQL_PASSWORD must match the credentials the local volume was initialized
    # with (see local-tools.example.yaml); a mismatch fails, it never resets the volume.
    AGENT_STORAGE_MYSQL_ENABLED: 'true'
    AGENT_STORAGE_REDIS_ENABLED: 'true'
    AGENT_MYSQL_URL: 'jdbc:mysql://127.0.0.1:3307/iot_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
    AGENT_MYSQL_USERNAME: 'iot_agent'
    AGENT_MYSQL_PASSWORD: ''
    AGENT_REDIS_URL: 'redis://127.0.0.1:6380'
    # Java-only security roots. Never copy any of these into the node entry.
    TASK_CREDENTIAL_KEY: ''   # required 64-hex key; stable across restarts and backups
    CONFIG_SECRET_KEY: ''     # required 64-hex admin configuration encryption key
    ADMIN_PASSWORD: ''        # required deployment administrator password
    # Console origin Java accepts for admin submissions; equals the console entry's
    # ADMIN_PROXY_ORIGIN below, not 0.0.0.0.
    ADMIN_ORIGIN: 'http://127.0.0.1:5185'
    # Production execution uses the real adapters; 'fixture' is for isolated tests only.
    AGENT_CONTROL_MODE: 'real'

node:
  executable: /opt/homebrew/opt/node@22/bin/node
  artifact: /Users/yourname/dev/iot-agent-backend/var/fixed-latest-YYYYMMDD-HHMMSS/agent-sidecar/dist/server.js
  working_directory: /Users/yourname/dev/iot-agent-backend/var/fixed-latest-YYYYMMDD-HHMMSS/agent-sidecar
  environment:
    # Private bridge only; the frontend never calls Node directly.
    SIDECAR_HOST: '127.0.0.1'
    SIDECAR_PORT: '3382'
    AGENT_BRIDGE_TOKEN: ''    # same random local-only token as the java entry
    JAVA_AGENT_TOOLS_URL: 'http://127.0.0.1:3381/internal/agent/tools'
    JAVA_AGENT_TOOLS_TOKEN: ''   # must equal the java entry's AGENT_BRIDGE_TOKEN
    JAVA_AGENT_SESSIONS_URL: 'http://127.0.0.1:3381/internal/agent/sessions'
    # No database, Redis, admin, model or Langfuse bootstrap values here: every /run
    # carries a complete Java-owned model definition snapshot, and observability is
    # fetched once from Java's private endpoint at process start. Optional runtime
    # limits (SIDECAR_RUN_TIMEOUT_MS, JAVA_AGENT_TOOL_TIMEOUT_MS, SIDECAR_HEARTBEAT_MS)
    # may be added when needed.

console:
  executable: /opt/homebrew/opt/node@22/bin/node
  artifact: /Users/yourname/dev/iot-agent-backend/web/admin/node_modules/vite/bin/vite.js
  working_directory: /Users/yourname/dev/iot-agent-backend/web/admin
  environment:
    PATH: '/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin'
    ADMIN_API_TARGET: 'http://127.0.0.1:3381'
    ADMIN_PROXY_ORIGIN: 'http://127.0.0.1:5185'
